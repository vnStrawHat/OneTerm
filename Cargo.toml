[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/local",
    "crates/ssh",
    "crates/ui",
]
resolver = "3"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
# GPUI core — cùng rev, cùng monorepo (xem docs/agents/dependencies.md §1)
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { path = "reference/gpui-component/crates/ui" }
gpui-component-assets = { path = "reference/gpui-component/crates/assets" }
gpui-component-macros = { path = "reference/gpui-component/crates/macros" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }

# Internal crates
myterm2-core = { path = "crates/core" }
myterm2-local = { path = "crates/local" }
myterm2-ssh = { path = "crates/ssh" }
myterm2-ui = { path = "crates/ui" }

# Terminal engine — fork Zed của alacritty_terminal (bản patched có TerminalContent/display_iter)
# Phải khớp rev mà GPUI dùng (xem docs/agents/dependencies.md §1)
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "fcf32feacb367b75ec84dd40f041e4fd411d3cc1" }
# Terminal helpers: URL detect + OSC 52 base64
linkify = "0.10"
base64 = "0.22"
# Event channel (SessionEvent subscribe) — không tokio lộ ra
async-channel = "2"
# PTY polling (same version as alacritty_terminal)
polling = "3.8"
# Logging (alacritty_terminal cũng dùng log)
log = "0.4"
# SSH client
russh = { version = "0.61", default-features = false, features = ["ring", "flate2", "rsa"] }
# russh-keys đã merge vào russh >= 0.50
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-util", "net", "macros"] }

# Async / serialization / error
anyhow = "1"
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# UI helpers
chrono = "0.4"
rust-i18n = "4"

# gpui-component path-dep workspace inheritance
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
schemars = "1"
serde_repr = "0.1"
smallvec = "1"
windows = { version = "0.58.0", features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"] }
# reqwest (needed by gpui-component-assets for WASM target — Cargo still parses manifest)"
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = ["charset", "http2", "macos-system-configuration", "multipart", "rustls-tls-native-roots", "socks", "stream"], package = "zed-reqwest", version = "0.12.15-zed" }

[workspace.lints.clippy]
# Giữ tương thích với gpui-component upstream (xem reference/Cargo.toml)
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
smol = { opt-level = 3 }

[profile.release]
# Optimised cho distributable binary.
# - lto = "fat" + codegen-units = 1: tối ưu xuyên suốt crate, exe nhỏ + nhanh hơn.
# - panic = "unwind": giữ mặc định — alacritty_terminal / smol có thể rely trên unwinding.
# - strip = "symbols": bỏ debug symbols → exe nhỏ. Debug info vẫn giữ qua split-debuginfo.
# - opt-level = 3 + overflow-checks = false: production semantics.
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"
overflow-checks = false
panic = "unwind"

[profile.release.package]
# GPUI/smol nặng: build với opt-level 3 luôn (kể cả build dep).
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
smol = { opt-level = 3 }

