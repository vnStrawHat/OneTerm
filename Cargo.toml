# OneTerm's root manifest (specs/oneterm, "The repository"). Each crate of Quadra the app's
# crates take is named once here, all at one commit; the crates name them with
# `workspace = true`.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The crates that are never published. The app's own version, the one a release reads and
# bumps, is written in crates/app/Cargo.toml.
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
quadra = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-app = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-async = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-build = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-code = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-data = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-design = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-native-win = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-platform = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-prim = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-render = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-shell = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-term = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-testing = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-tree = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
quadra-updater = { git = "https://github.com/vnStrawHat/Quadra", rev = "d935a041f2ba151441ec5dd0ecd8617ddde07171" }
oneterm-app = { path = "crates/app" }
oneterm-completion = { path = "crates/completion" }
oneterm-ssh = { path = "crates/ssh" }
oneterm-vault = { path = "crates/vault" }

# Unsafe code is Quadra's, at the OS boundary; none is written here.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

# A vault's key takes 64 MiB and three passes of Argon2id (specs/oneterm, "Saved passwords"):
# seconds unoptimized, so a debug build and its tests optimize these two.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# What ships: release, with the whole program optimized at once (scripts/build-release.sh).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
