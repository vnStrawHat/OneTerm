[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/local",
    "crates/ssh",
    "crates/ui",
]
resolver = "3"
# Vendored OneTerm fork of alacritty_terminal + vte (patched below). Excluded as
# workspace members — they are consumed via [patch] and built as dependencies.
exclude = ["vendor/vte", "vendor/alacritty_terminal"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
# GPUI core — cùng rev, cùng monorepo (xem docs/agents/dependencies.md §1)
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ea6b194db04cc7c0474851f07c7d5b7a9df6a98b" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "ea6b194db04cc7c0474851f07c7d5b7a9df6a98b" }

# Internal crates
oneterm-core = { path = "crates/core" }
oneterm-local = { path = "crates/local" }
oneterm-ssh = { path = "crates/ssh" }
oneterm-ui = { path = "crates/ui" }

# Terminal engine — fork Zed của alacritty_terminal (bản patched có TerminalContent/display_iter)
# Phải khớp rev mà GPUI dùng (xem docs/agents/dependencies.md §1)
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "fcf32feacb367b75ec84dd40f041e4fd411d3cc1" }
# Terminal helpers: URL detect + OSC 52 base64
linkify = "0.10"
base64 = "0.22"
# Event channel (SessionEvent subscribe) — không tokio lộ ra
async-channel = "2"
# PTY polling (same version as alacritty_terminal)
polling = "3.8"
# Logging (alacritty_terminal cũng dùng log)
log = "0.4"
env_logger = "0.11"
# SSH client
russh = { version = "0.61", default-features = false, features = ["ring", "flate2", "rsa"] }
# SFTP subsystem cho russh — mở SFTP channel trên cùng SSH connection
russh-sftp = "2.3"
# russh-keys đã merge vào russh >= 0.50
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-util", "net", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Async / serialization / error
anyhow = "1"
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# UI helpers
chrono = "0.4"
# System resource monitoring (CPU/memory of the OneTerm process)
sysinfo = "0.37"
rust-i18n = "4"

[workspace.lints.clippy]
# Giữ tương thích với gpui-component upstream (xem reference/Cargo.toml)
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
smol = { opt-level = 3 }
# Hot render/parse path — keep DOOM-fire (and other full-screen high-fps TUIs)
# usable and correct under `cargo run`. At opt-level = 0 the per-frame cost is
# 20-100x slower, so the UI thread never returns to the Windows message pump
# (window goes "Not Responding") and the render can't keep pace with the pump.
#
# The hot path spans FOUR of our crates, not just the UI:
#   - oneterm-ui:        the ~13k-quad paint loop + box-drawing geometry + layout.
#   - alacritty_terminal: Term::advance() parsing the fire's escape stream.
#   - oneterm-core:      TerminalContent::from() clones ~5.4k cells per snapshot
#                        (held under the Term FairMutex) — unoptimized this
#                        starves the PTY pump thread.
#   - oneterm-local / -ssh: the PTY pump loop + OSC side-parser + state locks.
# Leaving any of these at opt-level = 0 leaves a slow link in the chain that
# blocks the whole pipeline, so DOOM-fire renders choppily / incompletely in
# debug even after the UI crate is optimized.
#
# Trade-off: stepping through the terminal backend in a debugger is less precise.
# Drop the crate you need to step through back to opt-level = 0 temporarily.
oneterm-ui = { opt-level = 3 }
oneterm-core = { opt-level = 3 }
oneterm-local = { opt-level = 3 }
oneterm-ssh = { opt-level = 3 }
alacritty_terminal = { opt-level = 3 }

[profile.release]
# Optimised cho distributable binary.
# - lto = "fat" + codegen-units = 1: tối ưu xuyên suốt crate, exe nhỏ + nhanh hơn.
# - panic = "unwind": giữ mặc định — alacritty_terminal / smol có thể rely trên unwinding.
# - strip = "symbols": bỏ debug symbols → exe nhỏ. Debug info vẫn giữ qua split-debuginfo.
# - opt-level = 3 + overflow-checks = false: production semantics.
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"
overflow-checks = false
panic = "unwind"

[profile.release.package]
# GPUI/smol nặng: build với opt-level 3 luôn (kể cả build dep).
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
smol = { opt-level = 3 }

# ── OneTerm fork of the terminal engine (vendored under vendor/) ──────────────
# Patches alacritty_terminal + its vte dep to add a single-pass OSC/clear hook
# (Handler::report_osc + Event::Osc / Event::ClearScreen), so the PTY pump no
# longer runs a second vte::Parser just to catch OSC 7/9/133 + screen clears.
# This intentionally breaks the upstream alacritty rev-lock — see
# docs/terminal-fullscreen-perf/09-patch-alacritty-fork.md and
# docs/agents/dependencies.md §1/§3.
[patch."https://github.com/zed-industries/alacritty"]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

[patch.crates-io]
vte = { path = "vendor/vte" }
