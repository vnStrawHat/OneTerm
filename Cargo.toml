[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/terminal",
    "crates/actions",
    "crates/settings",
    "crates/state",
    "crates/theme",
    "crates/workspace",
    "crates/terminal-view",
    "crates/sftp-ui",
    "crates/session-ui",
    "crates/settings-ui",
    "crates/agent-ui",
    "crates/highlight",
    "crates/update",
    "crates/local-shell",
    "crates/ssh",
    "crates/completion",
    "crates/tools",
]
resolver = "3"
# Vendored dependency snapshots (patched below). Excluded as workspace members;
# they are consumed via [patch] and built as dependencies.
exclude = [
    "vendor/vte",
    "vendor/alacritty_terminal",
    "vendor/gpui-component",
]

[workspace.package]
# Single version source for every workspace crate, the release workflow, and the
# macOS bundle. Read it with:
#   awk -F'"' '/^version = "/{print $2; exit}' Cargo.toml
version = "0.4.2"
publish = false
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/vnStrawHat/OneTerm"
# Keep in sync with rust-toolchain.toml.
rust-version = "1.96.0"

[workspace.dependencies]
# GPUI core — same revision and monorepo (see docs/agents/dependencies.md §1)
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ea6b194db04cc7c0474851f07c7d5b7a9df6a98b" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "ea6b194db04cc7c0474851f07c7d5b7a9df6a98b" }

# Internal crates
oneterm-core = { path = "crates/core" }
oneterm-terminal = { path = "crates/terminal" }
oneterm-actions = { path = "crates/actions" }
oneterm-settings = { path = "crates/settings" }
oneterm-state = { path = "crates/state" }
oneterm-theme = { path = "crates/theme" }
oneterm-workspace = { path = "crates/workspace" }
oneterm-terminal-view = { path = "crates/terminal-view" }
oneterm-sftp-ui = { path = "crates/sftp-ui" }
oneterm-session-ui = { path = "crates/session-ui" }
oneterm-settings-ui = { path = "crates/settings-ui" }
oneterm-agent-ui = { path = "crates/agent-ui" }
oneterm-highlight = { path = "crates/highlight" }
oneterm-local-shell = { path = "crates/local-shell" }
oneterm-update = { path = "crates/update" }
oneterm-ssh = { path = "crates/ssh" }
oneterm-completion = { path = "crates/completion" }

# Terminal engine — Zed fork of alacritty_terminal with TerminalContent/display_iter,
# VENDORED at vendor/alacritty_terminal (this rev = the pristine base; OneTerm's delta
# lives in vendor/patches/alacritty_terminal/*). The git source is kept and redirected
# by the [patch] section below on purpose (BUILD-10 evaluated and rejected): a direct
# `path =` dependency would make `cargo fmt --all` / `cargo clippy` treat the vendored
# tree as a local path dependency (rustfmt would then re-format upstream sources with
# OneTerm's .rustfmt.toml and fail `--check`), whereas a [patch] source stays outside
# every workspace-wide tool scope. Cost: one upstream clone on a cold cache.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "fcf32feacb367b75ec84dd40f041e4fd411d3cc1" }
# Terminal helpers: URL detect + OSC 52 base64
aho-corasick = "1"
regex = "1"
base64 = "0.22"
# Event channel (SessionEvent subscription) — keeps Tokio out of the public API
async-channel = "2"
# PTY polling (same version as alacritty_terminal)
polling = "3.8"
# Logging (also used by alacritty_terminal)
log = "0.4"
env_logger = "0.11"
# Native exception/signal capture. Keep exact: callback safety is version-reviewed.
crash-handler = "=0.8.0"
# SSH client
russh = { version = "0.61", default-features = false, features = ["ring", "flate2", "rsa"] }
# SFTP subsystem for russh — opens an SFTP channel on the same SSH connection
russh-sftp = "2.3"
# Open a path in the OS default application (SFTP "Edit" workflow, OS-default mode).
open = "5"
# Filesystem watcher for the SFTP "Edit" workflow (detect local saves of the temp copy).
notify = "7"
# russh-keys was merged into russh >= 0.50
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-util", "net", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
rand = "0.10"

# Async / serialization / error
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"] }
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# UI helpers
chrono = "0.4"
# System resource monitoring (CPU/memory of the OneTerm process)
sysinfo = "0.37"
# Embedded theme JSON + icon assets (theme crate)
rust-embed = "8.7"
# Windows FFI (Ctrl handler, file locking / replace, DOOM-fire console mode). One version
# for every first-party crate (0.59 = the version alacritty_terminal uses; 0.61 moved
# `BOOL` to `windows_sys::core`); the feature set is the union of what they need.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
# Compile assets/oneterm.rc → embed app icon + version info into the exe (app build.rs).
embed-resource = "3"
# DOOM-fire diagnostic (crates/tools): terminal size detection on Unix.
libc = "0.2"

[workspace.lints.clippy]
# Preserve compatibility with upstream gpui-component (see reference/Cargo.toml)
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
# Third-party hot crates are always optimized in dev: they rarely change (no
# rebuild cost) and are never stepped through in a debugger.
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
smol = { opt-level = 3 }
alacritty_terminal = { opt-level = 3 }

# `fast-dev` — dev profile with OneTerm's own hot-path crates optimized too
# (`cargo run -p oneterm-app --profile fast-dev`). Use it to run DOOM-fire and
# other full-screen high-fps TUIs from a debug build: at opt-level = 0 the
# per-frame cost is 20-100x slower, so the UI thread never returns to the
# Windows message pump (window goes "Not Responding") and the render can't keep
# pace with the pump.
#
# The hot path spans FOUR first-party crates, not just the terminal view:
#   - oneterm-terminal-view: the ~13k-quad paint loop + box-drawing geometry + layout.
#   - oneterm-terminal:  TerminalContent::from() clones ~5.4k cells per snapshot
#                        (held under the Term FairMutex) — unoptimized this
#                        starves the PTY pump thread.
#   - oneterm-local-shell / -ssh: the PTY pump loop + state locks.
# Leaving any of these at opt-level = 0 leaves a slow link in the chain that
# blocks the whole pipeline.
#
# These overrides deliberately live in a named profile rather than in `dev`
# (BUILD-09): plain `dev` (and `test`, which inherits it) keeps first-party code
# at opt-level = 0 for precise debugging and fast incremental rebuilds.
[profile.fast-dev]
inherits = "dev"

[profile.fast-dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
smol = { opt-level = 3 }
alacritty_terminal = { opt-level = 3 }
oneterm-terminal-view = { opt-level = 3 }
oneterm-core = { opt-level = 3 }
oneterm-terminal = { opt-level = 3 }
oneterm-settings = { opt-level = 3 }
oneterm-local-shell = { opt-level = 3 }
oneterm-ssh = { opt-level = 3 }

[profile.release]
# Optimized for the distributable binary.
# - lto = "fat" + codegen-units = 1: whole-program optimization and a smaller binary.
# - panic = "unwind": keep the default because alacritty_terminal / smol may rely on unwinding.
# - debug = 0 + strip = "symbols": no debug info is generated and the symbol table is
#   stripped for a smaller binary. Consequence: NO .pdb/.dSYM exists for a release, so
#   release crash reports (docs/crash-reporting.md) carry unsymbolicated frames; the
#   panic message + module offsets are still recorded. To symbolicate a release,
#   switch to `debug = "line-tables-only"` + `split-debuginfo = "packed"` and publish
#   the .pdb/.dSYM next to the archive (BUILD-08 follow-up).
# - opt-level = 3 + overflow-checks = false: production semantics.
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"
overflow-checks = false
panic = "unwind"

[profile.release.package]
# GPUI/smol are expensive: always build them with opt-level 3 (including dependencies).
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
smol = { opt-level = 3 }

# ── OneTerm fork of the terminal engine (vendored under vendor/) ──────────────
# Patches alacritty_terminal + its vte dep to add a single-pass OSC/clear hook
# (Handler::report_osc + Event::Osc / Event::ClearScreen), so the PTY pump no
# longer runs a second vte::Parser just to catch OSC 7/9/133 + screen clears.
# This intentionally breaks the upstream alacritty rev-lock — see
# docs/terminal-fullscreen-perf/09-patch-alacritty-fork.md and
# docs/agents/dependencies.md §1/§3.
[patch."https://github.com/zed-industries/alacritty"]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { path = "vendor/gpui-component" }

[patch.crates-io]
vte = { path = "vendor/vte" }
