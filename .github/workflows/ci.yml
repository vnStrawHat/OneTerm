# OneTerm continuous integration checks.
# Keep architecture policy verification independent from the platform build matrix.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-graph:
    name: Verify dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify workspace policy
        run: python scripts/verify-dependency-graph.py
      - name: Verify UI fork baseline
        run: python scripts/check-ui-fork.py
