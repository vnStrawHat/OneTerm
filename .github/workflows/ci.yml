# OneTerm continuous integration checks.
# Keep architecture policy verification independent from the platform build matrix.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".rustfmt.toml"
      - "README.md"
      - "AGENTS.md"
      - "LICENSE"
      - "NOTICE"
      - "THIRD-PARTY-NOTICES.md"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".gitattributes"
      - "docs/**"
      - "scripts/**"
      - "crates/**"
      - ".github/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".rustfmt.toml"
      - "README.md"
      - "AGENTS.md"
      - "LICENSE"
      - "NOTICE"
      - "THIRD-PARTY-NOTICES.md"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".gitattributes"
      - "docs/**"
      - "scripts/**"
      - "crates/**"
      - ".github/**"

permissions:
  contents: read

# One run per ref: a newer push to the same branch/PR cancels the in-progress run
# (BUILD-28). Release builds have their own group in release.yml.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-graph:
    name: Verify dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify workspace policy and crate versions
        run: python scripts/verify-dependency-graph.py
      - name: Validate completion catalogs
        run: python scripts/completion-catalog.py validate
      - name: Verify architecture documentation paths
        run: python scripts/check-doc-paths.py
      - name: Verify THIRD-PARTY-NOTICES.md is current
        # Offline: cargo metadata against Cargo.lock (no build). Also refuses a
        # Cargo.lock that needs updating (--locked).
        run: python scripts/third-party-notices.py --check
      - name: Test contributor-facing text checker
        run: python -m unittest scripts/test_check_english.py
      - name: Verify contributor-facing text language
        run: python scripts/check-english.py

  cargo-deny:
    name: Licenses, bans, advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans advisories

  workspace-quality:
    name: Full workspace quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-23
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23
      - name: Install Linux system dependencies (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-dev libxkbcommon-dev \
            libx11-dev libxext-dev libxft-dev libxrandr-dev libxi-dev libxtst-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libdbus-1-dev \
            libgbm-dev libegl-dev \
            libfontconfig1 libfontconfig-dev libfreetype6-dev
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `terminal-diagnostics` guards ~200 lines of incident diagnostics that no
      # other step compiles — 18 bare `#[cfg(feature = …)]` sites inside
      # `crates/local-shell`'s read loop alone. Without this step they rot until
      # the incident that wants them (`IN-0032` § 2.4, `US-0090`).
      - name: Lint workspace with terminal diagnostics
        run: cargo clippy --workspace --all-targets --features oneterm-app/terminal-diagnostics -- -D warnings
      # No separate `cargo build --workspace`: clippy --all-targets already
      # type-checks every target and `cargo test` links them (BUILD-28).
      - name: Test workspace
        run: cargo test --workspace
      # The VT engine's whole-history integrity walk (IN-0029 R-28). It is
      # bounded to the rows an operation touched by default, because at a
      # 100 000-row scrollback the full walk costs milliseconds per `feed`; CI
      # is where the unbounded invariants are gated.
      - name: Test the VT engine with the full integrity walk
        run: cargo test -p oneterm-vt --features vt-paranoid
      # `regex` gates a whole matcher, so the suite runs under it too: the
      # literal half must answer identically with the feature on.
      - name: Test the VT engine with regex search
        run: cargo test -p oneterm-vt --features regex

  vt-package:
    # `oneterm-vt` is not published (owner ruling 2026-09-15), but other projects
    # depend on it by git, so what it packages, what it documents and what it
    # exposes are still contracts with people outside this repository. This job
    # is where they are gated.
    name: Packaged crate (oneterm-vt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-23
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23
      # The default feature set is `pty` (`US-0104`), so these two builds are
      # different configurations, and `--examples` proves the example in the
      # README still builds.
      - name: Build the feature matrix
        run: |
          cargo build -p oneterm-vt --no-default-features --examples
          # Building it is not running it: `tests/engine_without_pty.rs` is
          # gated `#[cfg(not(feature = "pty"))]`, so this is the only step
          # that executes the transport-free engine.
          cargo test -p oneterm-vt --no-default-features
          cargo build -p oneterm-vt --all-features --examples
      # The README's six-dependency claim is a claim about
      # `--no-default-features` specifically now that a default feature adds
      # dependencies. This is what keeps it from being prose.
      - name: The transport-free build is six leaf dependencies
        run: |
          set -euo pipefail
          leaves="$(cargo tree -p oneterm-vt -e normal --no-default-features --prefix none |
            awk 'NR > 1 {print $1}' | sort -u | paste -sd' ' -)"
          expected='bitflags log memchr rustc-hash unicode-segmentation unicode-width'
          if [ "$leaves" != "$expected" ]; then
            echo "::error::oneterm-vt --no-default-features must be exactly six leaf dependencies, got: $leaves"
            exit 1
          fi
      - name: Run the headless example
        run: cargo run -p oneterm-vt --example headless
      # `#![warn(missing_docs)]` plus denied rustdoc warnings: an undocumented
      # public item or a broken intra-doc link fails here rather than on docs.rs.
      # Both feature states: an intra-doc link to a cfg-gated item resolves under
      # `--all-features` and is broken in a default build, which is the build
      # most embedders get (`US-0101` verification note 4). `--all-features` runs
      # **last** because the next step reads `target/doc` with `--no-doc` and the
      # committed surface is the all-features one; swapping the two silently
      # drops every gated item from the generated surface.
      - name: Document with warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc -p oneterm-vt --no-deps
          cargo doc -p oneterm-vt --no-deps --all-features
      # This job runs on Linux, so `--check` compares `public-api.unix.txt`; the
      # Windows job's surface lives in `public-api.windows.txt` (`US-0104`).
      # `--diff-platforms` asserts the two differ only inside `oneterm_vt::pty`.
      - name: Check the public API surface
        run: |
          python scripts/vt-public-api.py --check --no-doc
          python scripts/vt-public-api.py --diff-platforms
      # The crate packages cleanly and carries what a consumer needs. Apache-2.0
      # 4(a) and 4(d) are why `LICENSE` and `NOTICE` are in the required set: a
      # git dependency is a distribution too.
      - name: Package the crate
        run: cargo package -p oneterm-vt
      - name: Check what the package carries
        # pipefail: without it the step reports python's status for a
        # `cargo package` that failed.
        run: |
          set -o pipefail
          cargo package -p oneterm-vt --list |
            python scripts/verify-dependency-graph.py --package-list -
      # Published rustdoc must read for somebody who does not have this
      # repository: no work-packet, decision or intake citations in `///` or
      # `//!` text, and no bare `crates/...` or `docs/...` path either -- a
      # consumer's vendored copy has neither. A link to the public repository is
      # the one allowed form.
      - name: Published rustdoc must stand alone
        run: |
          if grep -rn '^[[:space:]]*//[/!].*\(US-0[0-9]\{3\}\|BUG-0[0-9]\{3\}\|DEC-0[0-9]\{3\}\|IN-0[0-9]\{3\}\|crates/\|docs/\)' \
              crates/vt/src --include='*.rs' | grep -v 'https://github.com/'; then
            echo "::error::published rustdoc cites a document only this repository has"
            exit 1
          fi
      # The embedder's guide is `//!` text too: every chapter is `include_str!`d
      # into an empty module. The chapters are Markdown, so there is no comment
      # prefix to match on.
      - name: The embedder guide must stand alone
        run: |
          if grep -rn '\(US-0[0-9]\{3\}\|BUG-0[0-9]\{3\}\|DEC-0[0-9]\{3\}\|IN-0[0-9]\{3\}\|crates/\|docs/\)' \
              crates/vt/docs/guide --include='*.md' | grep -v 'https://github.com/'; then
            echo "::error::the embedder guide cites a document only this repository has"
            exit 1
          fi

  windows-quality:
    # Windows is the primary platform, so lint and run the whole workspace
    # (including the GPUI-based UI crates) there as well.
    name: Windows workspace quality gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-23
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint workspace with terminal diagnostics
        run: cargo clippy --workspace --all-targets --features oneterm-app/terminal-diagnostics -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      # The VT engine's whole-history integrity walk (IN-0029 R-28). It is
      # bounded to the rows an operation touched by default, because at a
      # 100 000-row scrollback the full walk costs milliseconds per `feed`; CI
      # is where the unbounded invariants are gated.
      - name: Test the VT engine with the full integrity walk
        run: cargo test -p oneterm-vt --features vt-paranoid

  vt-bench:
    # The VT engine benchmark (IN-0029). It RECORDS and never gates: at
    # realistic shell and SSH rates the engine has two to three orders of
    # magnitude of headroom, so a threshold here would be a flaky test
    # measuring the runner. `continue-on-error` plus no assertions is the
    # point — read the artifact, do not let it fail a pull request.
    name: VT engine benchmark (recorded, never gated)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-23
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23
      - name: Run the five tiers
        # A smaller byte budget than a local record run: a shared runner is not
        # the machine the baseline in the packet was measured on, and this job
        # exists to show a trend, not to replace that measurement.
        run: >
          cargo run -p oneterm-tools --release --bin vt-bench --
          all --mib 25 --out vt-bench.md
      - name: Publish the table
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vt-bench-${{ github.sha }}
          path: vt-bench.md

  # Linux and Windows already run `cargo test --workspace` in the two quality
  # gates above; macOS is the only platform without that coverage.
  macos-tests:
    name: macOS backend tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-23
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23
      - name: Test portable backend contracts
        run: cargo test -p oneterm-core -p oneterm-terminal -p oneterm-local-shell -p oneterm-ssh
