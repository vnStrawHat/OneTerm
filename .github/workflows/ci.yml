# OneTerm continuous integration checks.
# Keep architecture policy verification independent from the platform build matrix.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
  pull_request:
    paths-ignore:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  dependency-graph:
    name: Verify dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify workspace policy
        run: python scripts/verify-dependency-graph.py
      - name: Verify gpui-component vendor patch
        run: python scripts/check-ui-fork.py
      - name: Verify architecture documentation paths
        run: python scripts/check-doc-paths.py
      - name: Validate scale benchmark manifest
        run: python scripts/benchmark-scale.py --list
      - name: Test contributor-facing text checker
        run: python -m unittest scripts/test_check_english.py
      - name: Verify contributor-facing text language
        run: python scripts/check-english.py

  workspace-quality:
    name: Full workspace quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07-23
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23
      - name: Install Linux system dependencies (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-dev libxkbcommon-dev \
            libx11-dev libxext-dev libxft-dev libxrandr-dev libxi-dev libxtst-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libdbus-1-dev \
            libgbm-dev libegl-dev \
            libfontconfig1 libfontconfig-dev libfreetype6-dev
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build workspace
        run: cargo build --workspace
      - name: Test workspace
        run: cargo test --workspace


  cross-platform-tests:
    name: Cross-platform backend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07-23
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23
      - name: Test portable backend contracts
        run: cargo test -p oneterm-core -p oneterm-terminal -p oneterm-local-shell -p oneterm-ssh
