# OneTerm's checks: on a push to main and on a pull request that touches what is built.
# Two jobs: on Windows, the one system OneTerm runs on, the gate (scripts/check.sh); and
# the dependency policy of deny.toml by cargo-deny: licences, bans, advisories, sources.
# Steps run in bash; the repository has no PowerShell.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "crates/**"
      - "scripts/**"
      - ".github/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "crates/**"
      - "scripts/**"
      - ".github/**"

permissions:
  contents: read

# One run per ref: a newer push to the same branch or pull request cancels the run in
# progress. Releases have a group of their own (release.yml).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Licenses, bans, advisories, sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans advisories sources

  quality:
    name: The gate (format, lints, tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned toolchain
        id: toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-23
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23

      # The gate a developer runs: no PowerShell, no long file, the design's ladders, the
      # release notes script's cases, format, lints, tests with the lock file as committed.
      - name: The gate
        run: bash scripts/check.sh
