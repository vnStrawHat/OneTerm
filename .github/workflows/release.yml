# .github/workflows/release.yml — Release pipeline for OneTerm.
#
# Triggers:
#   • workflow_dispatch (choose bump: patch / minor / major) — computes the next
#     version, builds with that VERSION, then commits VERSION and publishes the
#     release only after all builds have succeeded.
#   • push tag v*                                 — builds & publishes the release
#     directly (VERSION must already be bumped to match the tag).
#
# Targets (matrix): Windows x86_64, Linux x86_64, macOS x86_64 (Intel) + aarch64
# (Apple Silicon). Release binary = `oneterm` (feature `release-bin`).
#
# Version sources: the `VERSION` file at the repo root (this workflow, the macOS
# bundle) and `[workspace.package] version` in the root Cargo.toml (CARGO_PKG_VERSION
# for every crate: About dialog, updater, Windows .rc version info). They must agree;
# `scripts/bump-version.sh` rewrites both and `scripts/verify-dependency-graph.py`
# fails CI when they drift.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# Avoid duplicate concurrent runs; do not cancel an in-progress release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # prepare — compute the next version (dispatch), or resolve the version from
  # the tag (tag push). Outputs `version`, `tag`, and `ref` for later jobs.
  # ──────────────────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.dispatch.outputs.version || steps.tagpush.outputs.version }}
      tag: ${{ steps.dispatch.outputs.tag || steps.tagpush.outputs.tag }}
      ref: ${{ steps.dispatch.outputs.ref || steps.tagpush.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      # Dispatch path: compute the next VERSION only. If the current VERSION
      # is already published, bump from it. If a release commit exists but is
      # not published yet, reuse the version already written in VERSION so a
      # rerun does not skip a number.
      - id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_REF="$(git rev-parse HEAD)"
          CURRENT="$(tr -d '[:space:]' < VERSION)"
          HEAD_SUBJECT="$(git log -1 --pretty=%s)"
          if gh release view "v${CURRENT}" >/dev/null 2>&1; then
            NEW="$(bash scripts/bump-version.sh "${{ inputs.bump }}")"
            git checkout -- VERSION
            echo "==> Bumped release VERSION to $NEW from published v${CURRENT}"
          elif [[ "${HEAD_SUBJECT}" == chore\(release\):* ]]; then
            NEW="${CURRENT}"
            echo "==> Reusing unpublished release VERSION $NEW"
          else
            NEW="$(bash scripts/bump-version.sh "${{ inputs.bump }}")"
            git checkout -- VERSION
            echo "==> Computed release VERSION $NEW from current VERSION $CURRENT"
          fi
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"

      # Tag-push path: resolve the version from the tag name; verify it matches
      # the VERSION file.
      - id: tagpush
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          FILEV="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILEV" != "$VERSION" ]; then
            echo "::error::VERSION file ($FILEV) does not match tag ($VERSION). Bump VERSION and commit before tagging."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # build — matrix build for 4 targets, stage the dist directory, upload artifact.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # macOS x86_64 (Intel) — cross-compiled from an Apple Silicon runner
          # (the macOS SDK supports both arches; no special linker setup needed).
          # macos-13 (Intel) is being deprecated by GitHub, so use macos-latest.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          # macOS aarch64 (Apple Silicon) — native build.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Apply release VERSION
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          # bump-version.sh rewrites VERSION + Cargo.toml + Cargo.lock together; it
          # refuses a no-op, so skip when the source ref already carries the version.
          if [ "$(tr -d '[:space:]' < VERSION)" != "$VERSION" ]; then
            bash scripts/bump-version.sh "$VERSION"
          fi

      - name: Verify release VERSION
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          FILEV="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILEV" != "$VERSION" ]; then
            echo "::error::VERSION file ($FILEV) does not match release version ($VERSION)."
            exit 1
          fi
          CARGOV="$(sed -n '/^\[workspace\.package\]/,/^\[workspace\.dependencies\]/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$CARGOV" != "$VERSION" ]; then
            echo "::error::[workspace.package] version ($CARGOV) does not match release version ($VERSION)."
            exit 1
          fi

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-23
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-dev libxkbcommon-dev \
            libx11-dev libxext-dev libxft-dev libxrandr-dev libxi-dev libxtst-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libdbus-1-dev \
            libgbm-dev libegl-dev \
            libfontconfig1 libfontconfig-dev libfreetype6-dev

      - name: Build release binary
        run: cargo build --release --no-default-features --features release-bin --target ${{ matrix.target }}

      - name: Stage dist
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          REL="target/${TARGET}/release"
          STAGE="dist/oneterm-${VERSION}-${TARGET}"
          mkdir -p "${STAGE}"
          # macOS: package into a proper OneTerm.app bundle so double-clicking
          # launches it directly (no Terminal.app window). See
          # scripts/bundle-macos.sh for details. sips + iconutil are present
          # on the macOS runner, so the .icns is generated too.
          if [[ "${TARGET}" == *darwin* ]]; then
            bash scripts/bundle-macos.sh "${PWD}" "${REL}" "${STAGE}"
          else
            # Binary: oneterm.exe (Windows) or oneterm (Linux).
            if [ -f "${REL}/oneterm.exe" ]; then
              cp "${REL}/oneterm.exe" "${STAGE}/"
            else
              cp "${REL}/oneterm" "${STAGE}/"
            fi
            # Windows runtime assets (build.rs already copied them into target/release).
            if [ -f "${REL}/conpty.dll" ]; then
              cp "${REL}/conpty.dll" "${STAGE}/"
            fi
            if [ -d "${REL}/x64" ]; then
              mkdir -p "${STAGE}/x64"
              cp "${REL}/x64/OpenConsole.exe" "${STAGE}/x64/"
            fi
          fi
          echo "==> Staged files:"
          find "${STAGE}" -type f | sort

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="oneterm-${VERSION}-${TARGET}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${STAGE}.zip" "${STAGE}"
          else
            tar -czf "${STAGE}.tar.gz" "${STAGE}"
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oneterm-${{ matrix.target }}
          path: dist/oneterm-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.*

  # ──────────────────────────────────────────────────────────────────────────
  # release — download all artifacts, generate release notes, create the GitHub
  # release, and upload the archives.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0 # full history for release notes

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="v${VERSION}"
          RELEASE_REF="${{ needs.prepare.outputs.ref }}"
          # Prefer the previous published GitHub release, not the previous git
          # tag. That keeps failed tags from becoming the changelog boundary.
          PREV_TAG="$(gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName' 2>/dev/null | awk -v tag="${TAG}" '$0 != tag { print; exit }' || true)"
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${RELEASE_REF}"
          else
            # First release: include the entire history.
            RANGE="${RELEASE_REF}"
          fi
          export VERSION TAG PREV_TAG RANGE RELEASE_REF
          python3 <<'PY' > notes.md
          import os
          import re
          import subprocess
          from collections import OrderedDict

          GROUPS = OrderedDict([
              ("feat", "Features"),
              ("fix", "Bug Fixes"),
              ("perf", "Perf"),
              ("refactor", "Refactor"),
              ("build", "Build"),
              ("ci", "CI"),
              ("test", "Tests"),
              ("docs", "Docs"),
              ("style", "Styles"),
              ("chore", "Chores"),
              ("revert", "Reverts"),
              ("other", "Others"),
          ])

          VERSION = os.environ["VERSION"]
          REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          PREV_TAG = os.environ.get("PREV_TAG", "")
          RANGE = os.environ["RANGE"]

          log = subprocess.check_output(
              [
                  "git",
                  "log",
                  RANGE,
                  "--format=%H%x1f%h%x1f%s%x1f%b%x1e",
                  "--no-merges",
              ],
              text=True,
          )

          grouped = {key: [] for key in GROUPS}
          breaking_changes = []
          conventional = re.compile(
              r"^(?P<type>[A-Za-z]+)(?:\((?P<scope>[^)]+)\))?(?P<breaking>!)?:\s*(?P<desc>.+)$"
          )
          release_commit = re.compile(r"^chore\(release\):\s*v?\d+\.\d+\.\d+(?:[-+].*)?$")

          for record in log.split("\x1e"):
              record = record.strip("\n")
              if not record:
                  continue
              full_hash, short_hash, subject, body = record.split("\x1f", 3)
              if release_commit.match(subject):
                  continue
              match = conventional.match(subject)
              if match:
                  commit_type = match.group("type").lower()
                  scope = match.group("scope")
                  description = match.group("desc")
                  is_breaking = bool(match.group("breaking"))
              else:
                  commit_type = "other"
                  scope = None
                  description = subject
                  is_breaking = False
              if re.search(r"(^|\n)BREAKING[ -]CHANGE:\s*", body):
                  is_breaking = True
              group = commit_type if commit_type in GROUPS else "other"
              prefix = f"**{scope}:** " if scope else ""
              commit_url = f"https://github.com/{REPOSITORY}/commit/{full_hash}"
              item = f"- {prefix}{description} ([`{short_hash}`]({commit_url}))"
              grouped[group].append(item)
              if is_breaking:
                  breaking_changes.append(item)

          print("## What's Changed")
          print()
          if PREV_TAG:
              print(f"Changes since `{PREV_TAG}`.")
          else:
              print("Initial release changes.")
          print()

          if breaking_changes:
              print("### Breaking Changes")
              print()
              print("\n".join(breaking_changes))
              print()

          wrote_section = False
          for key, title in GROUPS.items():
              entries = grouped[key]
              if not entries:
                  continue
              wrote_section = True
              print(f"### {title}")
              print()
              print("\n".join(entries))
              print()

          if not wrote_section and not breaking_changes:
              print("No notable changes.")
              print()
          PY
          echo "==> Release notes:"
          cat notes.md

      - name: Commit VERSION and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="v${VERSION}"
          RELEASE_REF="${{ needs.prepare.outputs.ref }}"
          EVENT="${{ github.event_name }}"
          echo "==> Artifacts to upload:"
          ls -la artifacts/
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
              echo "::error::workflow_dispatch releases must run from a branch ref."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ "$(tr -d '[:space:]' < VERSION)" != "$VERSION" ]; then
              bash scripts/bump-version.sh "$VERSION"
            fi
            git add VERSION Cargo.toml Cargo.lock
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): v${VERSION}"
            fi
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
            RELEASE_REF="$(git rev-parse HEAD)"
            gh release create "${TAG}" \
              --target "${RELEASE_REF}" \
              --title "OneTerm ${VERSION}" \
              --notes-file notes.md \
              artifacts/oneterm-*
          else
            gh release create "${TAG}" \
              --title "OneTerm ${VERSION}" \
              --notes-file notes.md \
              artifacts/oneterm-*
          fi
