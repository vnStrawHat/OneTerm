[package]
name = "oneterm-app"
description = "Binary entry point for OneTerm."
publish = false
edition.workspace = true
build = "build.rs"
# Dev: cargo run → oneterm-debug (target/debug/oneterm-debug.exe)
# Release: cargo build --release --no-default-features --features release-bin → oneterm (target/release/oneterm.exe)
default-run = "oneterm-debug"

[features]
default = ["dev-bin"]
# Bin target cho dev build — tên file có hậu tố `-debug` (vd. oneterm-debug.exe).
dev-bin = []
# Bin target cho release build — tên file sạch (oneterm.exe / oneterm).
release-bin = []

# Logic dùng chung — cả hai bin shim đều gọi `oneterm_app::run()`.
[lib]
name = "oneterm_app"
path = "src/lib.rs"

[[bin]]
name = "oneterm-debug"
path = "src/bin/oneterm-debug.rs"
required-features = ["dev-bin"]

[[bin]]
name = "oneterm"
path = "src/bin/oneterm.rs"
required-features = ["release-bin"]

[lints]
workspace = true

[dependencies]
oneterm-ui.workspace = true
oneterm-core.workspace = true

gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true

anyhow.workspace = true
env_logger.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }

[target.'cfg(windows)'.build-dependencies]
# Biên dịch assets/oneterm.rc → nhúng app icon + version info vào exe (cả oneterm-debug lẫn oneterm).
embed-resource = "3"