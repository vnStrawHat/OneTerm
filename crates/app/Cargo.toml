[package]
name = "oneterm-app"
description = "OneTerm: a terminal app of local shells, in tabs and spaces side by side (specs/oneterm)"
# OneTerm's versions go on from those of the app it replaces (specs/oneterm, "Updates"): this is
# the version last released, and the release workflow bumps it, to 0.7.0 the first time.
version = "0.6.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The library keeps the app's name: tests and the shots tool drive it as `oneterm`.
[lib]
name = "oneterm"

[[bin]]
name = "oneterm"
path = "src/main.rs"

[dependencies]
quadra.workspace = true
quadra-code.workspace = true
quadra-data.workspace = true
quadra-design.workspace = true
oneterm-completion.workspace = true
oneterm-ssh.workspace = true
oneterm-vault.workspace = true
quadra-shell.workspace = true
quadra-updater.workspace = true
quadra-term = { workspace = true, features = ["pty"] }
quadra-tree.workspace = true

[build-dependencies]
quadra-build.workspace = true

[dev-dependencies]
oneterm-ssh = { workspace = true, features = ["testing"] }
quadra-render.workspace = true
quadra-testing.workspace = true
quadra-tree.workspace = true
