[package]
name = "oneterm-workspace"
description = "OneTerm app shell: DockArea workspace, title bar, menus, status bar, widgets, persistence, zoom (feature-agnostic)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Profiling sites (IN-0046): with this feature off every
# `#[cfg_attr(feature = "hotpath-profiling", hotpath::measure)]` vanishes and
# `hotpath` is not in the graph. Only `oneterm-app` turns measuring on.
hotpath-profiling = ["dep:hotpath"]

[lints]
workspace = true

[dependencies]
oneterm-core.workspace = true
oneterm-terminal.workspace = true
oneterm-state.workspace = true
oneterm-settings.workspace = true
oneterm-theme.workspace = true
oneterm-actions.workspace = true
gpui.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
gpui-fps.workspace = true
anyhow.workspace = true
serde_json.workspace = true
log.workspace = true
chrono.workspace = true
sysinfo.workspace = true
hotpath = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# `GetProcessMemoryInfo` for the status bar's private working set (`US-0137`).
windows-sys.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
