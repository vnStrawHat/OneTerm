[package]
name = "oneterm-vt"
description = "An embeddable terminal core: VT parser, grid with scrollback, reflow, selection, damage-tracked snapshots, Sixel and an optional pseudo-console transport. No rendering, no policy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["terminal", "vt100", "ansi", "emulator", "tui"]
categories = ["command-line-interface", "parser-implementations", "emulators"]
# Owner ruling 2026-09-15: not published to crates.io. Other projects depend on
# it by git for now; everything above is kept so the flip is one line here.
publish = false

[lints]
workspace = true

[features]
# The pseudo-console transport (ConPTY on Windows, openpty on Unix). On by
# default: a terminal core that cannot open a terminal is a surprise. VT-only
# embedders that already own their transport turn it off, and
# `--no-default-features` is then the only build with no platform code in it.
default = ["pty"]
pty = ["dep:polling", "dep:windows-sys", "dep:libc"]
# The whole-history integrity walk, for property tests, fuzzing and CI.
# By default the always-on checks stay O(1) and the debug walk at `feed`,
# `resize` and `render_update` is bounded to the rows that operation touched.
# This feature widens both to the whole scrollback, which costs milliseconds per
# call at a 100 000-row history: correct to gate on, far too slow for a release
# build.
vt-paranoid = []

# Regular-expression scrollback search (`search::SearchPattern::Regex`). Off by
# default: the literal scanner needs nothing, and the default dependency set is
# a promise. Enabling it adds `regex` and its three crates and changes no
# behaviour the literal scanner already had.
regex = ["dep:regex"]

[dependencies]
bitflags.workspace = true
log.workspace = true
# The ground-state control-byte scan (`memchr3(ESC, LF, CR)`); already in Cargo.lock.
memchr.workspace = true
# Optional, default-off: the `regex` feature's matcher. Nothing in the default
# build reaches it.
regex = { workspace = true, optional = true }
rustc-hash.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
# PUBLIC dependency, and only under `pty`: Poller, Event and PollMode appear in
# the `EventedReadWrite` signatures, so a `polling` major bump is a breaking
# change to this crate's API.
polling = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
