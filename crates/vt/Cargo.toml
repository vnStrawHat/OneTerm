[package]
name = "oneterm-vt"
description = "OneTerm's VT engine: parser, dispatch, cell/style/grapheme storage, grid, reflow, damage and graphics. Depends on no OneTerm crate and no GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The full two-screen integrity walk after every step, for the property tests
# and the fuzz targets (IN-0029 R-28, `testing-and-bench.md` M12). The always-on
# tier stays O(1); this one is off by default because it turns a 10 000-case
# property run into a multi-minute job.
vt-paranoid = []

[dependencies]
bitflags.workspace = true
log.workspace = true
# The ground-state control-byte scan (`memchr3(ESC, LF, CR)`); already in Cargo.lock.
memchr.workspace = true
rustc-hash.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
proptest.workspace = true
# The differential oracle (IN-0029 R-41), retired with the fork at US-0087. The
# workspace `[patch]` redirects this at vendor/vte, whose two patches touch only
# `src/ansi.rs` — so `vte::Parser` + `vte::Perform`, the raw state machine this
# test compares against, are unmodified upstream. `tests/differential.rs`
# asserts that precondition rather than trusting it.
vte.workspace = true
