[package]
name = "oneterm-vt"
description = "An embeddable terminal core: VT parser, grid with scrollback, reflow, selection, damage-tracked snapshots and Sixel. No rendering, no PTY, no policy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["terminal", "vt100", "ansi", "emulator", "tui"]
categories = ["command-line-interface", "parser-implementations", "emulators"]
# The only crate in the workspace that overrides the inherited `publish = false`.
# A reviewer must be able to `grep -n publish crates/*/Cargo.toml` and see one
# line; CI asserts the count.
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# The whole-history integrity walk, for the property tests, the fuzz targets and
# CI (IN-0029 R-28, `testing-and-bench.md` M12). The always-on tier stays O(1);
# the debug walk at `feed` / `resize` / `render_update` is bounded to the rows
# the operation touched. This feature widens both back to O(history), which is
# milliseconds per call at a 100 000-row scrollback — correct to gate on, far
# too slow to leave on by default. CI passes `--features vt-paranoid`.
vt-paranoid = []

[dependencies]
bitflags.workspace = true
log.workspace = true
# The ground-state control-byte scan (`memchr3(ESC, LF, CR)`); already in Cargo.lock.
memchr.workspace = true
rustc-hash.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
proptest.workspace = true
