[package]
name = "oneterm-ssh"
description = "SSH + SFTP implementation for OneTerm (russh)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
terminal-diagnostics = []

[lints]
workspace = true

[dependencies]
oneterm-core.workspace = true
oneterm-terminal.workspace = true
# No `crates/ssh` source names the fork (`US-0084`). The line survives because
# `impl_pty_terminal_session!` expands `::alacritty_terminal` paths into this
# crate for `TerminalRender::set_default_colors` and `TerminalInput::mouse_down`,
# whose signatures are the compatibility surface `US-0085` deletes.
alacritty_terminal.workspace = true
async-channel.workspace = true
russh.workspace = true
tokio.workspace = true
log.workspace = true
thiserror.workspace = true
russh-sftp.workspace = true
tokio-util.workspace = true

[dev-dependencies]
oneterm-terminal = { workspace = true, features = ["test-support"] }
rand.workspace = true
futures.workspace = true
