[package]
name = "oneterm-ssh"
description = "OneTerm's SSH and SFTP: russh on a tokio runtime of its own, behind a blocking API (specs/oneterm, P2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The test server and client (`testing`), for this crate's tests and the app's.
testing = []

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
# A passphrase wiped once used (Quadra's specs/01, R15).
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
oneterm-ssh = { path = ".", features = ["testing"] }
