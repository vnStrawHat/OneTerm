[package]
name = "oneterm-terminal-view"
description = "OneTerm terminal feature: the GPUI terminal panel, rendering, input, split spaces, and terminal settings panel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# UI-side diagnostics overlay (frame timing). Backend diagnostics are enabled
# from the app crate.
terminal-diagnostics = []
# Function-level profiling sites (IN-0046). Off by default: without it every
# `#[cfg_attr(feature = "hotpath-profiling", hotpath::measure)]` vanishes and
# `hotpath` is not in the graph. Only `oneterm-app` turns measuring on.
hotpath-profiling = [
    "dep:hotpath",
    "oneterm-terminal/hotpath-profiling",
    "oneterm-highlight/hotpath-profiling",
]

[lints]
workspace = true

[dependencies]
oneterm-core.workspace = true
oneterm-terminal.workspace = true
oneterm-settings.workspace = true
oneterm-state.workspace = true
oneterm-theme.workspace = true
oneterm-actions.workspace = true
oneterm-highlight.workspace = true
oneterm-completion.workspace = true

gpui.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
async-channel.workspace = true
log.workspace = true
chrono.workspace = true
serde_json.workspace = true
image.workspace = true
hotpath = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
oneterm-terminal = { workspace = true, features = ["test-support"] }

# The real DirectWrite text system for the glyph cache's ASCII fast-path test (US-0146).
[target.'cfg(windows)'.dev-dependencies]
gpui_platform.workspace = true
