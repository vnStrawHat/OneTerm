[package]
name = "oneterm-terminal-view"
description = "OneTerm terminal feature: the GPUI terminal panel, rendering, input, split spaces, and terminal settings panel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# UI-side diagnostics overlay (frame timing). Backend diagnostics are enabled
# from the app crate.
terminal-diagnostics = []

[lints]
workspace = true

[dependencies]
oneterm-core.workspace = true
oneterm-terminal.workspace = true
oneterm-settings.workspace = true
oneterm-state.workspace = true
oneterm-theme.workspace = true
oneterm-actions.workspace = true
oneterm-highlight.workspace = true
oneterm-completion.workspace = true

gpui.workspace = true
gpui-component.workspace = true
alacritty_terminal.workspace = true
async-channel.workspace = true
itertools.workspace = true
log.workspace = true
chrono.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
oneterm-terminal = { workspace = true, features = ["test-support"] }
