[package]
name = "oneterm-terminal"
description = "Terminal adapter for OneTerm: TerminalSession trait + content/palette/encode/osc/url-policy/search over the oneterm-vt engine (no GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = []

[lints]
workspace = true

[dependencies]
oneterm-core.workspace = true
# The adapter never names `oneterm_vt::pty`; the workspace entry has the
# engine's `pty` feature off, so nothing here compiles ConPTY or `openpty`.
oneterm-vt.workspace = true
# The adapter owns the lock; the engine holds none (HLD decision 6 and 7).
parking_lot.workspace = true
async-channel.workspace = true
base64.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true