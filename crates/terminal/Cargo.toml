[package]
name = "oneterm-terminal"
description = "Terminal adapter for OneTerm: TerminalSession trait + content/palette/encode/osc/url-policy/search over the oneterm-vt engine (no GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = []

[lints]
workspace = true

[dependencies]
oneterm-core.workspace = true
oneterm-vt.workspace = true
# The adapter owns the lock; the engine holds none (HLD decision 6 and 7).
parking_lot.workspace = true
async-channel.workspace = true
base64.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The engine being replaced, for `tests/us0081_parity.rs` only: the
# old-versus-new differential feeds both engines the same bytes and compares the
# snapshots field by field. Nothing in `src/` names it since US-0085; US-0087
# deletes the test and this line together (`migration.md` § "Deletion list").
alacritty_terminal.workspace = true