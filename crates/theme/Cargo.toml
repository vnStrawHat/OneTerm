[package]
name = "oneterm-theme"
description = "OneTerm theme registry + AppIcon icon set + embedded icon assets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
oneterm-settings.workspace = true
oneterm-actions.workspace = true
gpui.workspace = true
gpui-component.workspace = true
anyhow.workspace = true
log.workspace = true
rust-embed.workspace = true

[dev-dependencies]
# `warning_is_the_value_the_theme_file_names` drives the kit's real
# `Theme::apply_config`: the only way to prove a theme key is one the kit
# actually reads, rather than one it silently drops (`IN-0043` MAJ-5).
gpui = { workspace = true, features = ["test-support"] }
