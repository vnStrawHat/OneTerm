[package]
name = "oneterm-session-ui"
description = "OneTerm session-management feature: the session tree panel, connect/quick-connect dialogs, and SSH session store."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Profiling sites (IN-0046): with this feature off every
# `#[cfg_attr(feature = "hotpath-profiling", hotpath::measure)]` vanishes and
# `hotpath` is not in the graph. Only `oneterm-app` turns measuring on.
hotpath-profiling = ["dep:hotpath"]

[lints]
workspace = true

[dependencies]
oneterm-core.workspace = true
oneterm-terminal.workspace = true
oneterm-terminal-view.workspace = true
oneterm-settings.workspace = true
oneterm-state.workspace = true
oneterm-theme.workspace = true
oneterm-actions.workspace = true

gpui.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
hotpath = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
