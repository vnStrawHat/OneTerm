[package]
name = "oneterm-local-shell"
description = "Local shell via PTY for OneTerm (oneterm_vt::pty)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
terminal-diagnostics = []
# Function-level profiling sites (IN-0046). Off by default: without it every
# `#[cfg_attr(feature = "hotpath-profiling", hotpath::measure)]` vanishes and
# `hotpath` is not in the graph. Only `oneterm-app` turns measuring on.
hotpath-profiling = ["dep:hotpath", "oneterm-terminal/hotpath-profiling"]

[lints]
workspace = true

[dependencies]
oneterm-core.workspace = true
oneterm-terminal.workspace = true
# The pseudo-console transport. `pty` is `oneterm-vt`'s default-on feature, and
# this is the crate that asks the workspace for it.
oneterm-vt = { workspace = true, features = ["pty"] }
async-channel.workspace = true
polling.workspace = true
log.workspace = true
hotpath = { workspace = true, optional = true }

[dev-dependencies]
oneterm-terminal = { workspace = true, features = ["test-support"] }

# Test-only: the BUG-0055 orphan probe watches the processes a spawn added as
# children of the test process (ToolHelp snapshot + process handle liveness).
[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true
