[package]
name = "oneterm-local-shell"
description = "Local shell via PTY for OneTerm (oneterm-pty)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
terminal-diagnostics = []

[lints]
workspace = true

[dependencies]
oneterm-core.workspace = true
oneterm-terminal.workspace = true
oneterm-pty.workspace = true
# Nothing in this crate names it: `impl_pty_terminal_session!` expands
# `::alacritty_terminal::{selection::SelectionType, vte::ansi::Rgb}` in the
# calling crate, so the line survives until `crates/terminal`'s public trait
# stops naming them (`US-0085`, then `US-0087`).
alacritty_terminal.workspace = true
async-channel.workspace = true
polling.workspace = true
log.workspace = true

[dev-dependencies]
oneterm-terminal = { workspace = true, features = ["test-support"] }
