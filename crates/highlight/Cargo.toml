[package]
name = "oneterm-highlight"
description = "Semantic highlighting for plain-text terminal output (pure Rust, no GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Function-level profiling sites (IN-0046). Off by default: without it every
# `#[cfg_attr(feature = "hotpath-profiling", hotpath::measure)]` vanishes and
# `hotpath` is not in the graph. Only `oneterm-app` turns measuring on.
hotpath-profiling = ["dep:hotpath"]

[lints]
workspace = true

[dependencies]
aho-corasick.workspace = true
regex.workspace = true
hotpath = { workspace = true, optional = true }