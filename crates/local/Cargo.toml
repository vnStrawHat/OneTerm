[package]
name = "myterm2-local"
description = "Local shell via PTY for myTerm2 (alacritty_terminal::tty)."
publish = false
edition.workspace = true

[lints]
workspace = true

[dependencies]
myterm2-core.workspace = true
alacritty_terminal.workspace = true
async-channel.workspace = true
polling.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }