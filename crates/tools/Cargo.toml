[package]
name = "oneterm-tools"
description = "OneTerm developer diagnostics (not shipped): DOOM-fire terminal workload, a raw ConPTY/PTY throughput probe, and a loopback SSH/SFTP server for SFTP-browser walks."
version.workspace = true
edition.workspace = true
# doom-fire.rs is a port of DOOM-fire-zig and keeps that project's GPL-3.0 licence
# (see THIRD-PARTY-NOTICES.md); pty-throughput.rs is OneTerm's own (Apache-2.0).
# Neither binary is part of a OneTerm release; deny.toml carries a crate-scoped
# exception for the GPL term. `corpus/` (US-0093) is third-party Apache-2.0 test
# data carried under its own `corpus/NOTICE`: it is not source, is compiled into
# nothing, and the GPL term above does not reach it.
license = "Apache-2.0 AND GPL-3.0-only"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Diagnostics only — this crate is never a dependency of the app; it sits
# outside the L0–L4 layering (docs/agents/crate-dependency-rules.md), like a
# `tools/` directory, and may only reach down to leaf crates.
[[bin]]
name = "doom-fire"
path = "src/bin/doom-fire.rs"

[[bin]]
name = "pty-throughput"
path = "src/bin/pty-throughput.rs"

[[bin]]
name = "sftp-dev-server"
path = "src/bin/sftp-dev-server.rs"

# --- IN-0029 / US-0072: the VT benchmark and parity harness -----------------
# A library half so the corpus comparison can be both a tool and a `#[test]`
# (tests/corpus_check.rs is the drift gate that runs in `cargo test --workspace`).
[lib]
name = "oneterm_tools"
path = "src/lib.rs"

[[bin]]
name = "vt-corpus"
path = "src/bin/vt-corpus.rs"

[[bin]]
name = "vt-bench"
path = "src/bin/vt-bench.rs"

# --- IN-0039 / US-0106: the esctest bridge ---------------------------------
# A pty-backed stdin/stdout bridge between the `esctest` conformance harness and
# `oneterm_vt::Terminal`. Unix only in substance (the file carries a Windows
# stub so every host still compiles it); the Linux CI job is the only place it
# runs, and it runs report-only.
[[bin]]
name = "vt-esctest"
path = "src/bin/vt-esctest.rs"
# ---------------------------------------------------------------------------

[dependencies]
# pty-throughput: the same PTY path OneTerm uses (`oneterm_vt::pty` + polling).
polling.workspace = true
# sftp-dev-server: the same SSH/SFTP crates OneTerm's client uses, server side.
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
rand.workspace = true

# --- IN-0029 / US-0072: the VT benchmark and parity harness -----------------
# The engine under test. `vt-corpus check` replays each recording through it and
# compares the result with the expectations the fork froze at US-0072; `vt-bench`
# measures the same engine across its five tiers.
# `pty` for `pty-throughput`; the other binaries use the engine alone.
oneterm-vt = { workspace = true, features = ["pty"] }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
# Reads size.json / config.json, writes the bench JSON table, and parses
# `expected-diffs.json` — the per-recording, cell-level declared differences.
# JSON rather than TOML because `toml` is on `docs/agents/dependencies.md` § 3's
# do-not-re-add list and a test harness does not justify reopening it.
serde_json.workspace = true
# ---------------------------------------------------------------------------

[target.'cfg(unix)'.dependencies]
# doom-fire: terminal size detection (TIOCGWINSZ).
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# doom-fire: console size + VT processing mode.
windows-sys.workspace = true
