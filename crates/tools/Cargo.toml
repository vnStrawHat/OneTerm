[package]
name = "oneterm-tools"
description = "OneTerm developer diagnostics (not shipped): DOOM-fire terminal workload, a raw ConPTY/PTY throughput probe, and a loopback SSH/SFTP server for SFTP-browser walks."
version.workspace = true
edition.workspace = true
# doom-fire.rs is a port of DOOM-fire-zig and keeps that project's GPL-3.0 licence
# (see THIRD-PARTY-NOTICES.md); pty-throughput.rs is OneTerm's own (Apache-2.0).
# Neither binary is part of a OneTerm release; deny.toml carries a crate-scoped
# exception for the GPL term.
license = "Apache-2.0 AND GPL-3.0-only"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Diagnostics only — this crate is never a dependency of the app and depends on
# no OneTerm crate (docs/agents/crate-dependency-rules.md: it sits outside the
# L0–L4 layering, like a `tools/` directory).
[[bin]]
name = "doom-fire"
path = "src/bin/doom-fire.rs"

[[bin]]
name = "pty-throughput"
path = "src/bin/pty-throughput.rs"

[[bin]]
name = "sftp-dev-server"
path = "src/bin/sftp-dev-server.rs"

# --- IN-0029 / US-0072: the VT benchmark and parity harness -----------------
# A library half so the corpus comparison can be both a tool and a `#[test]`
# (tests/corpus_check.rs is the drift gate that runs in `cargo test --workspace`).
[lib]
name = "oneterm_tools"
path = "src/lib.rs"

[[bin]]
name = "vt-corpus"
path = "src/bin/vt-corpus.rs"

[[bin]]
name = "vt-bench"
path = "src/bin/vt-bench.rs"
# ---------------------------------------------------------------------------

[dependencies]
# pty-throughput: the same PTY path OneTerm uses (alacritty_terminal::tty + polling).
alacritty_terminal.workspace = true
polling.workspace = true
# sftp-dev-server: the same SSH/SFTP crates OneTerm's client uses, server side.
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
rand.workspace = true

# --- IN-0029 / US-0072: the VT benchmark and parity harness -----------------
# vt-corpus / vt-bench: `alacritty_terminal` above is the engine being replaced
# and the only one that ever blesses an expectation.
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# `expected-diffs.toml`: the per-recording, cell-level declared differences.
toml.workspace = true
# ---------------------------------------------------------------------------

[target.'cfg(unix)'.dependencies]
# doom-fire: terminal size detection (TIOCGWINSZ).
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# doom-fire: console size + VT processing mode.
windows-sys.workspace = true
